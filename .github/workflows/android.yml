name: Android CI/CD

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ] # 当推送以 v 开头的标签（如 v1.0）时触发发布
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 必须开启写入权限，才能创建 Release

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Resolve build version
      run: |
        if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
          VERSION_NAME="${GITHUB_REF_NAME#v}"
        else
          VERSION_NAME=$(grep -m1 'versionName = ' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
        fi
        echo "VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_ENV"

    - name: Run tests and build Debug/Release APKs
      run: ./gradlew testDebugUnitTest assembleDebug assembleRelease

    - name: Prepare APK artifacts
      run: |
        mkdir -p artifacts
        cp app/build/outputs/apk/debug/app-debug.apk "artifacts/NekoFeed-v${VERSION_NAME}-debug.apk"
        cp app/build/outputs/apk/release/app-release.apk "artifacts/NekoFeed-v${VERSION_NAME}-release.apk"
        cp app/build/outputs/apk/release/app-release.apk "artifacts/NekoFeed-release.apk"

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: NekoFeed-v${{ env.VERSION_NAME }}-debug-${{ github.sha }}
        path: artifacts/NekoFeed-v${{ env.VERSION_NAME }}-debug.apk
        if-no-files-found: error

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: NekoFeed-v${{ env.VERSION_NAME }}-release-${{ github.sha }}
        path: artifacts/NekoFeed-v${{ env.VERSION_NAME }}-release.apk
        if-no-files-found: error

    - name: Upload Latest Release APK Alias
      uses: actions/upload-artifact@v4
      with:
        name: NekoFeed-release-latest-${{ github.sha }}
        path: artifacts/NekoFeed-release.apk
        if-no-files-found: error

    # 只有在推送标签（Tag）时才执行以下发布步骤
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          artifacts/NekoFeed-v${{ env.VERSION_NAME }}-debug.apk
          artifacts/NekoFeed-v${{ env.VERSION_NAME }}-release.apk
          artifacts/NekoFeed-release.apk
        name: Release ${{ github.ref_name }}
        tag_name: ${{ github.ref_name }}
        draft: false
        prerelease: false
        generate_release_notes: true # 自动根据提交记录生成更新日志
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
